app:
  name: "The Feed"
  port: 3000
  poll_interval_minutes: 15
  items_per_page: 50
  retention_days: 30

# Optional — All-view algorithm knobs. Every field falls back to the defaults
# in lib/config.ts (shown below), so this whole block can be omitted. Editable
# live from the Tune section (/tune), which is also where the effects can be
# previewed before saving.
# algorithm:
#   priority:            # interleave priority; 0 removes a category from All
#     music: 4
#     books: 4
#     film: 4
#     tech_review: 4
#     podcasts: 3
#     reading: 2
#     bluesky: 1
#   bsky_ratio: 4        # 1 bluesky post per N RSS items in the All view
#   bsky_window: 100     # unread bluesky posts kept; older ones hard-deleted
#   surprise: 3          # recency bias of the bluesky sample (0 = uniform)
#   jitter: 0.35         # interleave cadence jitter (0 = mechanical)
#   ttl_days: 7          # RSS unread shelf life; or per-category { music: 14, default: 7 }
#   retention_days: 7    # silently-dismissed items hard-deleted after this

sources:
  # Per-source options: poll_interval_minutes (min minutes between fetches;
  # unset = every crawl) and paused: true (skip the source, keep its items).
  - id: pitchfork
    name: Pitchfork
    type: rss
    category: music
    url: https://pitchfork.com/feed/feed-news/rss
    poll_interval_minutes: 30

  - id: aquarium-drunkard
    name: Aquarium Drunkard
    type: rss
    category: music
    url: https://aquariumdrunkard.com/feed/

  - id: rogerebert
    name: RogerEbert.com
    type: rss
    category: film
    url: https://www.rogerebert.com/feed

  - id: nyt-books
    name: NYT Book Review
    type: rss
    category: books
    url: https://rss.nytimes.com/services/xml/rss/nyt/BookReview.xml

  - id: kottke
    name: Kottke.org
    type: rss
    category: reading
    url: https://feeds.kottke.org/main

  # --- Bluesky ---
  # "Popular With Friends" algorithmic feed — posts your network engages with
  - id: bluesky-friends
    name: Bluesky
    type: bluesky
    category: bluesky
    mode: feed
    feed_uri: at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.generator/with-friends
    poll_interval_minutes: 10
